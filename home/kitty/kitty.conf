# Fonts
font_family       DejaVuSansM Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0

disable_ligatures never

# Cursor
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# Animated trail following cursor jumps. The value is a ms dwell time: only
# cursors that sat still that long get a trail, so TUI redraws don't smear.
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
scrollback_lines            10000
scrollback_pager_history_size 64
wheel_scroll_multiplier     3.0

# Mouse
mouse_hide_wait      2.0
copy_on_select       no
strip_trailing_spaces smart
url_style            curly
detect_urls          yes

# Bell
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes

# Window
remember_window_size   no
initial_window_width   110c
initial_window_height  30c
window_padding_width   10
window_border_width    1pt
draw_minimal_borders   yes
hide_window_decorations yes
confirm_os_window_close 0

# Transparency
background_opacity         0.85
dynamic_background_opacity yes

# Tabs
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2
tab_title_template   "{index}: {title}"

# Layouts
enabled_layouts splits,stack,tall

# Performance
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# Shell integration
# Keep no-rc: nixpkgs patches the default to "enabled no-rc" because kitty's own
# rc sourcing looks for /etc/bash.bashrc and ~/.bashrc, neither of which exist on
# NixOS (bash is built with SYS_BASHRC=/etc/bashrc). Dropping no-rc loses PS1,
# ble.sh, completions and aliases.
shell_integration enabled no-rc

# Keybindings
map ctrl+shift+enter launch --cwd=current --location=split
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down
map ctrl+shift+z     toggle_layout stack
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+o     set_background_opacity +0.05
map ctrl+shift+i     set_background_opacity -0.05
